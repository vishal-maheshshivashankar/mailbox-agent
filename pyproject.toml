[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mailbox-agent"
version = "0.2.0"
description = "LangGraph agent that sorts/labels Gmail and retires old low-value mail with Drive backup + Telegram approval"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "google-api-python-client>=2.140.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.8.0",
    "APScheduler>=3.10.4",
    "mcp>=1.2.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-requests",
    "commitizen>=3.29.0",
]

[project.scripts]
mailbox-agent-serve = "mailbox_agent.scripts.serve:main"
mailbox-agent-add-account = "mailbox_agent.scripts.add_account:main"
mailbox-agent-sort = "mailbox_agent.scripts.run_sort:main"
mailbox-agent-sweep = "mailbox_agent.scripts.run_sweep:main"
mailbox-agent-telegram-bot = "mailbox_agent.scripts.telegram_bot:main"
mailbox-agent-eval = "mailbox_agent.eval.run_eval:main"
mailbox-agent-preview-classify = "mailbox_agent.scripts.preview_classify:main"
mailbox-agent-test-telegram = "mailbox_agent.scripts.test_telegram:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mailbox_agent.db" = ["schema.sql"]
"mailbox_agent.eval" = ["golden_set.jsonl"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["tests/", "build/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "eval: LLM classification quality evals - calls the real Gemini API, costs money, run explicitly with `pytest -m eval`",
]
addopts = "-m 'not eval'"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.2.0"
version_files = ["pyproject.toml:version"]
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
