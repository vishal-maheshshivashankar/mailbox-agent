name: Classification eval

# Manual only - run this deliberately before/after a toolkit/llm.py change
# (prompt edit, model swap), not automatically on every push. It calls the
# real Gemini API and costs a small amount of money each run. See
# docs/EVALUATION.md for why this isn't a blocking CI check.
on:
  workflow_dispatch:
    inputs:
      threshold:
        description: "Minimum accuracy to pass (0-1)"
        default: "0.75"

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -e ".[dev]"

      - name: Run classification eval
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: mailbox-agent-eval --threshold "${{ github.event.inputs.threshold }}"
