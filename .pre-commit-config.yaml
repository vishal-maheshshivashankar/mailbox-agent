# pip install pre-commit && pre-commit install && pre-commit install --hook-type commit-msg
# Runs on every `git commit`; catches lint/type/format issues before they
# reach a PR instead of in CI review comments. commitizen enforces
# Conventional Commits so `cz bump` can derive the next version/tag.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.29.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy src
        language: system
        pass_filenames: false
        types: [python]

      - id: pytest-unit
        name: pytest (unit)
        entry: pytest tests/unit
        language: system
        pass_filenames: false
        types: [python]
